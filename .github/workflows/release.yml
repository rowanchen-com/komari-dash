name: Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/zip.mjs

      - name: Read package version
        id: package
        shell: bash
        run: node -p '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"

      - name: Upload theme package
        uses: actions/upload-artifact@v7
        with:
          name: KomariDash
          path: KomariDash.zip
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download theme package
        uses: actions/download-artifact@v8
        with:
          name: KomariDash

      - name: Check whether release exists
        if: github.event_name == 'workflow_dispatch'
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "GitHub release lookup failed: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Create release
        if: github.event_name == 'workflow_dispatch' && steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: KomariDash.zip
          generate_release_notes: true

      - name: Rebuild existing release asset
        if: github.event_name == 'workflow_dispatch' && steps.release_check.outputs.exists == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: KomariDash.zip

      - name: Upload to published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: KomariDash.zip
